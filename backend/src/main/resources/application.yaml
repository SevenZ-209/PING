
spring:
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  application:
    name: backend

  datasource:
    url: jdbc:postgresql://localhost:5432/ping
    username: ping
    password: ${DB_PASSWORD}

  flyway:
    enabled: true

resend:
  api-key: ${RESEND_API_KEY}
  from-email: ${RESEND_FROM_EMAIL:PING <onboarding@resend.dev>}

jwt:
  secret: ${JWT_SECRET}
  issuer: ping-backend
  audience: ping-api
  access-token-ttl: 15m