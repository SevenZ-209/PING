
services:
  postgres:
    image: postgres:17
    container_name: ping-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ping
      POSTGRES_USER: ping
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ping_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ping -d ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  ping_postgres_data:
